name: Polish book link and brand icons once

on:
  push:
    branches:
      - mature-links

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mature-links
          fetch-depth: 0

      - name: Polish book link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_css = '''    .social-links a {
      margin: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }'''
          new_css = '''    .social-links a {
      margin: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }
    .social-links .book-link {
      text-decoration: none;
    }'''
          if old_css not in text:
              raise SystemExit('social link CSS block not found')
          text = text.replace(old_css, new_css, 1)

          old_book = '<a href="https://wooten.link/book" target="_blank" aria-label="Book PDF">📘</a>'
          new_book = '<a class="book-link" href="https://wooten.link/book" target="_blank" aria-label="My Book">📘</a>'
          if old_book not in text:
              raise SystemExit('book link not found')
          text = text.replace(old_book, new_book, 1)

          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/mature-links-book-icons-once.yml
          git add index.html
          git config user.name "John Wooten"
          git config user.email "60260750+JFWooten4@users.noreply.github.com"
          git commit -m "Polish book link accessibility" -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:mature-links
