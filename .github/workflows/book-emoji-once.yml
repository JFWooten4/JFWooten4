name: Replace book icon once

on:
  push:
    branches:
      - mature-links

permissions:
  contents: write

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mature-links
          fetch-depth: 0

      - name: Replace SVG book icon with emoji
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()
          old = '''      <a href="https://wooten.link/book" target="_blank" aria-label="Book PDF">\n        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">\n          <path fill="#4da3ff" d="M3 4.5c2.65-.84 5.14-.62 7.5.66V20c-2.36-1.28-4.85-1.5-7.5-.66V4.5Zm18 0v14.84c-2.65-.84-5.14-.62-7.5.66V5.16C15.86 3.88 18.35 3.66 21 4.5ZM12 5.78C11.55 5.42 11.05 5.1 10.5 4.82V19.3c.55.28 1.05.6 1.5.96.45-.36.95-.68 1.5-.96V4.82c-.55.28-1.05.6-1.5.96Z"/>\n        </svg>\n      </a>'''
          new = '''      <a href="https://wooten.link/book" target="_blank" aria-label="Book PDF">📘</a>'''
          if old not in text:
              raise SystemExit("book SVG block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/book-emoji-once.yml
          git add index.html
          git config user.name "John Wooten"
          git config user.email "60260750+JFWooten4@users.noreply.github.com"
          git commit -m "Use book emoji for book link" -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:mature-links
