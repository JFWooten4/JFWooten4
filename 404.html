<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wooten.link Redirect</title>
  <meta name="description" content="Wooten.link redirect page. JavaScript redirects known shortlinks; automated clients may inspect the redirect map in this document.">
  <meta name="robots" content="noindex, follow">
  <style>
    html, body {
      background-color: black;
    }
  </style>
</head>
<body>
  <script type="text/plain" id="main-redirects">
{% include_relative var/main.toml %}
  </script>
  <script type="text/plain" id="law-redirects">
{% include_relative var/law.toml %}
  </script>
  <script>
{% include redirect-core.js %}
{% include_relative api/_pdf-pages.js %}
    const redirects = mergeRedirects(
      parseRedirects(document.getElementById("main-redirects").textContent, false),
      parseRedirects(document.getElementById("law-redirects").textContent, false)
    );
    const destination = resolveRedirect(redirects, window.location.pathname, "/search");
    navigateToDestination(destination, window.location);
  </script>
</body>
</html>
