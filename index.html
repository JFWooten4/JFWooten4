<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John Wooten</title>
  <style>
    :root {
      --accent: #fdda24;
      --credit-fade-in: 1.8s;
      --credit-fade-out: 420ms;
      --credit-box-resize: 1.1s;
    }
    html, body {
      background-color: black;
      color: white;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: larger;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body {
      position: relative;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    /* Slow crossfading friend-photo background behind the landing page content. */
    .background-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .background-layer {
      position: absolute;
      inset: -3%;
      background-position: center 50%;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 4.2s ease-in-out;
      will-change: opacity;
    }
    .background-layer.is-visible {
      opacity: 0.22;
    }
    .background-shade {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.24), rgba(0, 0, 0, 0.58)),
        linear-gradient(180deg, rgba(0, 0, 0, 0.46), rgba(0, 0, 0, 0.58));
    }
    .background-credit {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .background-credit-card {
      box-sizing: border-box;
      max-width: min(680px, calc(100vw - 36px));
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(10, 8, 16, 0.48);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.26);
      text-align: left;
      pointer-events: none;
      overflow: hidden;
      transition:
        height var(--credit-box-resize) ease,
        background-color var(--credit-box-resize) ease,
        border-color var(--credit-box-resize) ease;
    }
    .background-credit-card a {
      pointer-events: auto;
    }
    .background-credit-card.is-resizing {
      border-color: rgba(255, 255, 255, 0.08);
      background-color: rgba(10, 8, 16, 0.3);
    }
    .background-credit-label {
      display: block;
      width: 100%;
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 0.66rem;
      letter-spacing: 0.03em;
      text-transform: none;
      text-align: center;
    }
    .background-credit-text {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.45;
      color: #f6f2fb;
      min-height: 1.5em;
      text-align: center;
      transition: opacity var(--credit-fade-in) ease;
    }
    .background-credit-text.is-changing {
      opacity: 0;
      transition-duration: var(--credit-fade-out);
    }
    .background-credit-text a {
      color: var(--accent);
    }
    .banner-credit {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .banner-credit-label {
      display: block;
      margin: 0 0 2px;
      color: var(--accent);
      font-size: 0.66rem;
      letter-spacing: 0.03em;
      text-align: center;
    }
    .banner-credit-text {
      margin: 0;
      color: #f6f2fb;
      font-size: 0.78rem;
      line-height: 1.4;
      text-align: center;
      transition: opacity var(--credit-fade-in) ease;
    }
    .banner-credit-text.is-changing {
      opacity: 0;
      transition-duration: var(--credit-fade-out);
    }
    .banner-credit-text a {
      color: var(--accent);
    }
    .content {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      text-align: center;
      padding: 40px;
      transform: translateY(-20px);
    }
    h2 {
      font-family: Verdana, sans-serif;
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .banner-name {
      display: grid;
      place-items: center;
      grid-template-columns: minmax(0, 1fr);
      width: min(1180px, 100%);
      max-width: 100%;
      min-width: 0;
      margin: 0 auto 24px;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(4.4rem, 13vw, 9.5rem);
      font-weight: 900;
      line-height: 0.78;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .banner-name-layer {
      grid-area: 1 / 1;
      color: transparent;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      filter: drop-shadow(0 2px 0 rgba(255, 255, 255, 0.5))
              drop-shadow(0 7px 12px rgba(0, 0, 0, 0.72));
      transition: opacity 4.2s ease-in-out;
      will-change: opacity;
    }
    .banner-name-layer.is-visible {
      opacity: 1;
    }
    h3 {
      font-family: Georgia, serif;
      margin-top: 45px;
      font-weight: 600;
    }
    a {
      color: var(--accent);
      font-weight: bold;
    }
    .content p {
      margin-top: 0;
      margin-bottom: 24px;
    }
    .social-links {
      margin-top: 0;
      margin-bottom: 30px;
      list-style: none;
      padding: 0 25px 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }
    .social-links a {
      margin: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      cursor: pointer;
    }
    .social-links img,
    .social-links svg {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
    }
    .linux-emoji {
      font-size: 32px;
      line-height: 1;
    }
    .friend-strip {
      margin-top: 84px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 900ms ease 160ms, transform 900ms ease 160ms;
    }
    .friend-strip.is-ready {
      opacity: 1;
      transform: translateY(0);
    }
    .friend-thumb {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(19, 16, 25, 0.84);
      padding: 0;
      border-radius: 18px;
      overflow: hidden;
      width: 108px;
      height: 72px;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, width 220ms ease, height 220ms ease;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
    }
    .friend-thumb:hover,
    .friend-thumb:focus-visible {
      width: 152px;
      height: 102px;
      transform: translateY(-3px);
      border-color: rgba(253, 218, 36, 0.55);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
      outline: none;
    }
    .friend-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 260ms ease;
    }
    .friend-thumb.is-loaded img {
      opacity: 1;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(0, 0, 0, 0.84);
      z-index: 20;
      backdrop-filter: blur(12px);
    }
    .lightbox.is-open {
      display: flex;
    }
    .lightbox-frame {
      position: relative;
      max-width: min(92vw, 1180px);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .lightbox-image {
      display: block;
      max-width: 100%;
      max-height: min(72vh, 88vw);
      border-radius: 22px;
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.45);
      transition: opacity 180ms ease, filter 180ms ease;
    }
    .lightbox.is-loading .lightbox-image {
      filter: saturate(0.82);
      opacity: 0.62;
    }
    .lightbox-loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15, 12, 22, 0.82);
      color: white;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.78rem;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .lightbox.is-loading .lightbox-loading {
      opacity: 1;
    }
    .lightbox-meta {
      max-width: min(92vw, 720px);
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .lightbox-date,
    .lightbox-info {
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(15, 12, 22, 0.82);
      color: #f4effa;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }
    .lightbox-date {
      flex: 0 0 auto;
      border-color: rgba(253, 218, 36, 0.7);
      background: var(--accent);
      color: #002E5D;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
    }
    .lightbox-info {
      flex: 1 1 auto;
      text-align: left;
    }
    .lightbox-info a {
      color: var(--accent);
    }
    .lightbox-close,
    .lightbox-nav {
      appearance: none;
      border: 0;
      background: rgba(20, 14, 29, 0.72);
      color: white;
      cursor: pointer;
      font-size: 1.8rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      box-shadow: 0 16px 38px rgba(253, 218, 36, 0.22);
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 64px;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      box-shadow: 0 16px 38px rgba(253, 218, 36, 0.22);
    }
    .lightbox-nav.prev {
      left: -58px;
    }
    .lightbox-nav.next {
      right: -58px;
    }
    @media (max-width: 720px) {
      .content {
        padding: 28px 18px 96px;
      }
      .banner-name {
        font-size: clamp(2.65rem, 13.2vw, 5.5rem);
        margin-bottom: 20px;
      }
      .friend-thumb {
        width: 92px;
        height: 62px;
      }
      .friend-thumb:hover,
      .friend-thumb:focus-visible {
        width: 122px;
        height: 82px;
      }
      .lightbox {
        padding: 18px;
      }
      .lightbox-frame {
        gap: 10px;
      }
      .lightbox-image {
        max-height: min(64vh, 92vw);
      }
      .lightbox-meta {
        max-width: 92vw;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 0.78rem;
      }
      .lightbox-date,
      .lightbox-info {
        font-size: 0.78rem;
        padding: 10px 12px;
      }
      .lightbox-info {
        flex-basis: 100%;
      }
      .lightbox-nav.prev {
        left: 8px;
      }
      .lightbox-nav.next {
        right: 8px;
      }
      .lightbox-close {
        top: 8px;
        right: 8px;
      }
      .background-credit {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }
      .background-credit-card {
        padding: 8px 10px;
        border-radius: 14px;
      }
      .background-credit-text {
        font-size: 0.76rem;
      }
      .banner-credit-text {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <div class="background-stage" aria-hidden="true">
    <div class="background-layer is-visible" id="bg-layer-a"></div>
    <div class="background-layer" id="bg-layer-b"></div>
    <div class="background-shade"></div>
  </div>
  <script type="application/json" id="friend-image-data">
    [
      {% assign friend_keys = "capstone-award,stellar-consensus,original-whydrs,marketing-consensus" | split: "," %}
      {% assign friend_index = 0 %}
      {% for friend_key in friend_keys %}
      {% for file in site.static_files %}
      {% assign file_key = file.name | split: '.' | first %}
      {% if file.path contains '/friends/large/' and file_key == friend_key %}
      {% if friend_index > 0 %},{% endif %}
      {
        "key": "{{ friend_key }}",
        "largeSrc": "{{ file.path }}",
        "mediumSrc": "/friends/medium/{{ friend_key }}.webp",
        "smallSrc": "/friends/small/{{ friend_key }}.webp",
        "alt": "Friend photo {{ friend_index }}",
        "position": "center 54%"
      }
      {% assign friend_index = friend_index | plus: 1 %}
      {% break %}
      {% endif %}
      {% endfor %}
      {% endfor %}
    ]
  </script>

  <script>
    (function () {
      var friendImageData = document.getElementById("friend-image-data");
      var friendCreditData = document.getElementById("friend-credit-data");
      var friendStrip = document.getElementById("friend-strip");
      var lightbox = document.getElementById("friend-lightbox");
      var lightboxImage = document.getElementById("lightbox-image");
      var lightboxLoading = document.getElementById("lightbox-loading");
      var lightboxDate = document.getElementById("lightbox-date");
      var lightboxInfo = document.getElementById("lightbox-info");
      var closeButton = document.getElementById("lightbox-close");
      var prevButton = document.getElementById("lightbox-prev");
      var nextButton = document.getElementById("lightbox-next");
      var images = [];
      var creditsByKey = {};
      var currentIndex = 0;
      var imageLoadCache = {};
      var previewLoadCache = {};
      var activeImageRequest = 0;
      var blankImageSrc = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";

      if (!friendImageData || !friendStrip || !lightbox || !lightboxImage || !lightboxLoading || !lightboxDate || !lightboxInfo || !closeButton || !prevButton || !nextButton) { return; }

      try {
        images = JSON.parse(friendImageData.textContent);
      } catch (error) {
        images = [];
      }

      if (friendCreditData) {
        try {
          creditsByKey = JSON.parse(friendCreditData.textContent);
        } catch (error) {
          creditsByKey = {};
        }
      }

      if (!images.length) {
        images = [
          {
            key: "capstone-award",
            largeSrc: "/friends/large/capstone-award.jpg",
            mediumSrc: "/friends/medium/capstone-award.webp",
            smallSrc: "/friends/small/capstone-award.webp",
            alt: "Friend photo 0",
            position: "center 54%"
          },
          {
            key: "stellar-consensus",
            largeSrc: "/friends/large/stellar-consensus.jpg",
            mediumSrc: "/friends/medium/stellar-consensus.webp",
            smallSrc: "/friends/small/stellar-consensus.webp",
            alt: "Friend photo 1",
            position: "center 54%"
          },
          {
            key: "original-whydrs",
            largeSrc: "/friends/large/original-whydrs.png",
            mediumSrc: "/friends/medium/original-whydrs.webp",
            smallSrc: "/friends/small/original-whydrs.webp",
            alt: "Friend photo 2",
            position: "center 54%"
          },
          {
            key: "marketing-consensus",
            largeSrc: "/friends/large/marketing-consensus.jpg",
            mediumSrc: "/friends/medium/marketing-consensus.webp",
            smallSrc: "/friends/small/marketing-consensus.webp",
            alt: "Friend photo 3",
            position: "center 54%"
          }
        ];
      }

      var thumbnails = [];
      var thumbnailsRendered = false;
      var routeNavigationInProgress = false;

      function getFriendIndexFromPath() {
        var match = window.location.pathname.match(/^\/friends\/([0-3])\/?$/);
        return match ? Number(match[1]) : -1;
      }

      function friendPath(index) {
        return "/friends/" + String(index);
      }

      function syncLightboxFromPath() {
        var index = getFriendIndexFromPath();

        if (index < 0 || index >= images.length) { return; }

        routeNavigationInProgress = true;

        if (window.location.pathname !== friendPath(index)) {
          window.history.replaceState(null, "", friendPath(index));
        }

        openLightbox(index);
        routeNavigationInProgress = false;
      }

      function renderThumbnails() {
        if (thumbnailsRendered) { return; }

        thumbnailsRendered = true;
        friendStrip.classList.remove("is-ready");
        friendStrip.innerHTML = "";
        var loadedThumbnailCount = 0;

        function markThumbnailLoaded(thumbnail) {
          if (thumbnail.classList.contains("is-loaded")) { return; }

          thumbnail.classList.add("is-loaded");
          loadedThumbnailCount += 1;

          if (loadedThumbnailCount >= images.length) { friendStrip.classList.add("is-ready"); }
        }

        images.forEach(function (image, index) {
          var thumbnail = document.createElement("a");
          var thumbnailImage = document.createElement("img");

          thumbnail.className = "friend-thumb";
          thumbnail.href = friendPath(index);
          thumbnail.setAttribute("data-lightbox-index", String(index));
          thumbnail.setAttribute("aria-label", "Open " + image.alt.toLowerCase());

          thumbnailImage.alt = image.alt;
          thumbnailImage.width = 360;
          thumbnailImage.height = 240;
          thumbnailImage.loading = "lazy";
          thumbnailImage.decoding = "async";
          thumbnailImage.fetchPriority = "low";
          thumbnailImage.addEventListener("load", function () {
            markThumbnailLoaded(thumbnail);
          });
          thumbnailImage.addEventListener("error", function () {
            markThumbnailLoaded(thumbnail);
          });
          thumbnailImage.src = image.smallSrc || image.mediumSrc || image.largeSrc || image.src;

          if (thumbnailImage.complete) { markThumbnailLoaded(thumbnail); }

          thumbnail.appendChild(thumbnailImage);
          friendStrip.appendChild(thumbnail);
        });

        thumbnails = Array.prototype.slice.call(document.querySelectorAll("[data-lightbox-index]"));
        thumbnails.forEach(function (thumbnail, index) {
          thumbnail.addEventListener("click", function (event) {
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) { return; }

            event.preventDefault();
            window.history.pushState(null, "", friendPath(index));
            openLightbox(index);
          });
        });

        syncLightboxFromPath();
      }

      function loadImageSrc(src, cache, options) {
        if (!src) { return Promise.resolve(null); }

        if (!cache[src]) {
          cache[src] = new Promise(function (resolve) {
            var loadingImage = new Image();
            var isFinished = false;

            function finish() {
              if (isFinished) { return; }

              isFinished = true;

              if (options && options.decode && typeof loadingImage.decode === "function") {
                loadingImage.decode().catch(function () {}).then(function () {
                  resolve(src);
                });
              } else {
                resolve(src);
              }
            }

            if (options && options.fetchPriority) { loadingImage.fetchPriority = options.fetchPriority; }

            loadingImage.decoding = "async";
            loadingImage.onload = finish;
            loadingImage.onerror = function () {
              resolve(null);
            };
            loadingImage.src = src;

            if (loadingImage.complete) { finish(); }
          });
        }

        return cache[src];
      }

      function getPreviewSources(image) {
        var sources = [];

        if (!image) { return sources; }

        [image.smallSrc, image.mediumSrc].forEach(function (src) {
          if (src && sources.indexOf(src) === -1) { sources.push(src); }
        });

        return sources;
      }

      function preloadPreviewImage(src, options) {
        return loadImageSrc(src, previewLoadCache, options);
      }

      function preloadFullImage(image, options) {
        var fullSrc = image && (image.largeSrc || image.src);

        if (!fullSrc) { return Promise.resolve(null); }

        loadImageSrc(image.mediumSrc || image.smallSrc, previewLoadCache, { fetchPriority: "low" });

        if (!imageLoadCache[fullSrc]) {
          imageLoadCache[fullSrc] = loadImageSrc(fullSrc, {}, options);
        }

        return imageLoadCache[fullSrc];
      }

      function preloadAdjacentImages(index) {
        preloadFullImage(images[(index + 1) % images.length]);
        preloadFullImage(images[(index - 1 + images.length) % images.length]);
      }

      function showImage(index) {
        currentIndex = (index + images.length) % images.length;

        if (!images[currentIndex]) { return; }

        if (lightbox.classList.contains("is-open") && !routeNavigationInProgress) {
          window.history.replaceState(null, "", friendPath(currentIndex));
        }

        var image = images[currentIndex];
        var requestId = activeImageRequest + 1;
        var displayedLevel = 0;
        var previewSources = getPreviewSources(image);
        activeImageRequest = requestId;

        function displayImage(src, level) {
          if (requestId !== activeImageRequest || !src || level < displayedLevel) { return; }

          displayedLevel = level;
          lightboxImage.src = src;
        }

        lightbox.classList.add("is-loading");
        lightboxImage.alt = image.alt;
        lightboxImage.src = previewSources[0] || blankImageSrc;
        displayedLevel = previewSources[0] ? 1 : 0;
        lightboxDate.textContent = (creditsByKey[image.key] && creditsByKey[image.key].date) || "Date unavailable";
        lightboxInfo.innerHTML = (creditsByKey[image.key] && creditsByKey[image.key].html) || "Credit unavailable.";

        previewSources.forEach(function (previewSrc, index) {
          preloadPreviewImage(previewSrc, { fetchPriority: "high" }).then(function (loadedPreviewSrc) {
            displayImage(loadedPreviewSrc, index + 1);
          });
        });

        preloadFullImage(image, { fetchPriority: "high" }).then(function (loadedSrc) {
          if (requestId !== activeImageRequest) { return; }

          displayImage(loadedSrc, previewSources.length + 1);
          preloadAdjacentImages(currentIndex);

          lightbox.classList.remove("is-loading");
        });
      }

      function openLightbox(index) {
        showImage(index);
        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.classList.remove("is-loading");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";

        if (!routeNavigationInProgress && getFriendIndexFromPath() >= 0) {
          window.history.pushState(null, "", "/");
        }
      }

      if (window.homepageInitialBackgroundReady) {
        renderThumbnails();
      } else {
        window.addEventListener("homepage:initial-background-ready", renderThumbnails, { once: true });
        window.setTimeout(renderThumbnails, 5000);
      }

      prevButton.addEventListener("click", function () {
        showImage(currentIndex - 1);
      });

      nextButton.addEventListener("click", function () {
        showImage(currentIndex + 1);
      });

      closeButton.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", function (event) {
        if (event.target === lightbox) { closeLightbox(); }
      });

      document.addEventListener("keydown", function (event) {
        if (!lightbox.classList.contains("is-open")) { return; }

        if (event.key === "Escape") {
          closeLightbox();
        } else if (event.key === "ArrowLeft") {
          showImage(currentIndex - 1);
        } else if (event.key === "ArrowRight") {
          showImage(currentIndex + 1);
        }
      });

      window.addEventListener("popstate", function () {
        var index = getFriendIndexFromPath();
        routeNavigationInProgress = true;

        if (index >= 0 && index < images.length) {
          openLightbox(index);
        } else if (lightbox.classList.contains("is-open")) {
          closeLightbox();
        }

        routeNavigationInProgress = false;
      });
    })();

    (function () {
      // Rotate the available background images through two layers so the
      // landing page gets a slow, low-opacity crossfade instead of a hard swap.
      var creditCard = document.getElementById("art-credit-card");
      var backgroundCreditText = document.getElementById("background-credit-text");
      var bannerCreditText = document.getElementById("banner-credit-text");
      var images = Array.isArray(window.homepageBackgroundImages) ? window.homepageBackgroundImages : [];
      var bannerImages = Array.isArray(window.homepageBannerImages) ? window.homepageBannerImages : [];
      var creditsByName = window.homepageBackgroundCredits || {};
      var bannerCreditsByName = window.homepageBannerCredits || {};
      var backgroundCreditTimeout = null;
      var bannerCreditTimeout = null;
      var creditFadeOutMs = 420;
      var creditCardResizeMs = 1100;
      var creditCardStartHeight = null;
      var creditCardResizeFrame = null;
      var creditCardResizeTimeout = null;

      function beginCreditCardResize() {
        if (!creditCard || creditCardStartHeight !== null) { return; }

        creditCardStartHeight = creditCard.getBoundingClientRect().height;
        creditCard.classList.add("is-resizing");
      }

      function finishCreditCardResize() {
        if (!creditCard || creditCardStartHeight === null) { return; }

        if (creditCardResizeFrame) { window.cancelAnimationFrame(creditCardResizeFrame); }

        creditCardResizeFrame = window.requestAnimationFrame(function () {
          var startHeight = creditCardStartHeight;

          creditCard.style.height = "auto";
          var targetHeight = creditCard.getBoundingClientRect().height;
          creditCard.style.height = startHeight + "px";
          creditCard.offsetHeight;
          creditCard.style.height = targetHeight + "px";

          creditCardStartHeight = null;
          creditCardResizeFrame = null;

          if (creditCardResizeTimeout) { window.clearTimeout(creditCardResizeTimeout); }

          creditCardResizeTimeout = window.setTimeout(function () {
            creditCard.style.height = "auto";
            creditCard.classList.remove("is-resizing");
            creditCardResizeTimeout = null;
          }, creditCardResizeMs);
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getImageKey(src) {
        if (!src) { return ""; }

        var filename = src.split("/").pop() || "";
        return filename.replace(/\.[^.]+$/, "");
      }

      function formatLink(label, href) {
        var rel = /^https?:\/\/(?:www\.)?x\.com(?:\/|$)/i.test(href) ? "noreferrer" : "noopener";
        return '<a href="' + escapeHtml(href) + '" target="_blank" rel="' + rel + '">' + escapeHtml(label) + "</a>";
      }

      function buildCreditContent(imageEntry) {
        var credit = creditsByName[imageEntry.key || getImageKey(imageEntry.src)] || {};
        var artistLabel = credit.artist || "Unknown artist";
        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);
        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";
        var parts = [artHtml + " by " + artistHtml];
        var textParts = ["Art by " + artistLabel];

        if (credit.sourceUrl) { textParts[0] = "Art by " + artistLabel; }

        return {
          html: parts.join(" · "),
          text: textParts.join(" · ")
        };
      }

      function buildBannerCreditContent(imageEntry) {
        var credit = bannerCreditsByName[imageEntry.key || getImageKey(imageEntry.src)] || {};
        var artistLabel = credit.artist || "Unknown artist";
        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);
        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";

        return artHtml + " by " + artistHtml;
      }

      function updateBannerCredit(imageEntry, useAnimation) {
        if (!bannerCreditText || !imageEntry) { return; }

        if (bannerCreditTimeout) {
          window.clearTimeout(bannerCreditTimeout);
          bannerCreditTimeout = null;
        }

        if (!useAnimation) {
          bannerCreditText.classList.remove("is-changing");
          bannerCreditText.innerHTML = buildBannerCreditContent(imageEntry);
          return;
        }

        beginCreditCardResize();
        bannerCreditText.classList.add("is-changing");
        bannerCreditTimeout = window.setTimeout(function () {
          bannerCreditText.innerHTML = buildBannerCreditContent(imageEntry);
          bannerCreditText.classList.remove("is-changing");
          bannerCreditTimeout = null;
          finishCreditCardResize();
        }, creditFadeOutMs);
      }

      function updateCredit(imageEntry, useAnimation) {
        if (!backgroundCreditText || !imageEntry) { return; }

        var content = buildCreditContent(imageEntry);

        if (backgroundCreditTimeout) {
          window.clearTimeout(backgroundCreditTimeout);
          backgroundCreditTimeout = null;
        }

        if (!useAnimation) {
          backgroundCreditText.classList.remove("is-changing");
          backgroundCreditText.innerHTML = content.html;
          return;
        }

        beginCreditCardResize();
        backgroundCreditText.classList.add("is-changing");
        backgroundCreditTimeout = window.setTimeout(function () {
          backgroundCreditText.innerHTML = content.html;
          backgroundCreditText.classList.remove("is-changing");
          backgroundCreditTimeout = null;
          finishCreditCardResize();
        }, creditFadeOutMs);
      }

      var layerA = document.getElementById("bg-layer-a");
      var layerB = document.getElementById("bg-layer-b");
      var bannerLayerA = document.getElementById("banner-name-layer-a");
      var bannerLayerB = document.getElementById("banner-name-layer-b");

      function markInitialBackgroundReady() {
        window.homepageInitialBackgroundReady = true;
        window.dispatchEvent(new Event("homepage:initial-background-ready"));
      }

      if (!layerA || !layerB || !images.length) {
        markInitialBackgroundReady();
        return;
      }

      var activeLayer = layerA;
      var inactiveLayer = layerB;
      var imageIndex = Math.floor(Math.random() * images.length);
      var activeBannerLayer = bannerLayerA;
      var inactiveBannerLayer = bannerLayerB;
      var bannerImageIndex = bannerImages.length ? Math.floor(Math.random() * bannerImages.length) : 0;
      var swapDelayMs = 8000;
      var fadeDurationMs = 4200;
      var creditLeadMs = 1900;
      var preloadDelayMs = 600;
      var imageCache = {};

      function preload(imageEntry, options) {
        var shouldDecode = !options || options.decode !== false;
        var fetchPriority = options && options.fetchPriority;

        if (imageCache[imageEntry.src]) { return imageCache[imageEntry.src]; }

        imageCache[imageEntry.src] = new Promise(function (resolve) {
          var image = new Image();

          function finish() {
            if (shouldDecode && typeof image.decode === "function") {
              image.decode().catch(function () {
                return null;
              }).then(function () {
                resolve(imageEntry);
              });
              return;
            }

            resolve(imageEntry);
          }

          if (fetchPriority) { image.fetchPriority = fetchPriority; }

          image.onload = finish;
          image.onerror = function () {
            resolve(imageEntry);
          };
          image.src = imageEntry.src;

          if (image.complete) { finish(); }
        });

        return imageCache[imageEntry.src];
      }

      function applyBackground(layer, imageEntry) {
        layer.style.backgroundImage = 'url("' + imageEntry.src + '")';
        layer.style.backgroundPosition = imageEntry.position;
      }

      function applyBanner(layer, imageEntry) {
        if (!layer || !imageEntry) { return; }

        layer.style.backgroundImage = 'url("' + imageEntry.src + '")';
      }

      function scheduleNextFade() {
        window.setTimeout(function () {
          var nextIndex = (imageIndex + 1) % images.length;
          var nextBannerIndex = bannerImages.length ? (bannerImageIndex + 1) % bannerImages.length : 0;
          var nextBannerPromise = bannerImages.length ? preload(bannerImages[nextBannerIndex]) : Promise.resolve(null);

          Promise.all([preload(images[nextIndex]), nextBannerPromise]).then(function (loadedImages) {
            var nextImage = loadedImages[0];
            var nextBanner = loadedImages[1];
            applyBackground(inactiveLayer, nextImage);
            applyBanner(inactiveBannerLayer, nextBanner);

            // Force the browser to register the new background before opacity changes.
            inactiveLayer.offsetHeight;

            inactiveLayer.classList.add("is-visible");
            activeLayer.classList.remove("is-visible");

            imageIndex = nextIndex;

            var previous = activeLayer;
            activeLayer = inactiveLayer;
            inactiveLayer = previous;

            if (nextBanner && activeBannerLayer && inactiveBannerLayer) {
              inactiveBannerLayer.offsetHeight;
              inactiveBannerLayer.classList.add("is-visible");
              activeBannerLayer.classList.remove("is-visible");
              bannerImageIndex = nextBannerIndex;

              var previousBannerLayer = activeBannerLayer;
              activeBannerLayer = inactiveBannerLayer;
              inactiveBannerLayer = previousBannerLayer;
            }

            window.setTimeout(function () {
              updateCredit(nextImage, true);
              updateBannerCredit(nextBanner, true);
            }, creditLeadMs);

            scheduleNextFade();
          });
        }, swapDelayMs);
      }

      var initialBannerPromise = bannerImages.length ? preload(bannerImages[bannerImageIndex], { decode: false, fetchPriority: "high" }) : Promise.resolve(null);

      Promise.all([
        preload(images[imageIndex], { decode: false, fetchPriority: "high" }),
        initialBannerPromise
      ]).then(function (initialImages) {
        var initialImage = initialImages[0];
        var initialBanner = initialImages[1];
        applyBackground(activeLayer, initialImage);
        applyBanner(activeBannerLayer, initialBanner);
        updateCredit(initialImage, false);
        updateBannerCredit(initialBanner, false);
        markInitialBackgroundReady();

        if (images.length < 2) { return; }

        window.setTimeout(function () {
          images.forEach(function (imageEntry, index) {
            if (index !== imageIndex) { preload(imageEntry); }
          });
          bannerImages.forEach(function (imageEntry, index) {
            if (index !== bannerImageIndex) { preload(imageEntry); }
          });
        }, preloadDelayMs);

        scheduleNextFade();
      });
    })();
  </script>
</body>
