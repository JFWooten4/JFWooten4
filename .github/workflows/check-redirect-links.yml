name: Check redirect destinations

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "vercel.json"
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "build-ignore"
      - "404.html"
      - "index.html"
      - "backgrounds/**"
      - "banners/**"
      - "redirects/*.toml"
      - ".github/ci/**"
      - "api/**"
      - "static/**"
      - ".github/workflows/check-redirect-links.yml"

permissions:
  contents: read

jobs:
  redirect-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test redirects, Codex launcher, and link checker
        run: node --test .github/ci/redirects.test.js .github/ci/codex-launcher.test.mjs .github/ci/check-redirect-links.test.js .github/ci/search-copy-toast.test.js .github/ci/redirect-link-issues.test.js
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Test static publishing
        run: bundle exec ruby .github/ci/publish-static.test.rb
      - name: Build the Jekyll site
        run: node api/_generate-redirects.js && bundle exec ruby api/_publish-static.rb
      - name: Verify published redirect registries and behavior
        run: node --test .github/ci/site-redirects.test.js
  live-redirect-links:
    if: github.event_name != 'pull_request'
    needs: redirect-links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    concurrency:
      group: redirect-link-audit-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check live redirect destinations
        id: audit
        env:
          LINK_CHECK_RESULTS: ${{ runner.temp }}/redirect-link-results.json
        run: node api/_check-redirect-links.js
      - name: Synchronize broken-link issue
        if: >-
          ${{ !cancelled() &&
          (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINK_CHECK_RESULTS: ${{ runner.temp }}/redirect-link-results.json
        run: node .github/ci/redirect-link-issues.js
