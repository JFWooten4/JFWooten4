name: Check redirect destinations

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "codex/**"
      - "vercel.json"
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "build-ignore"
      - "404.html"
      - "index.html"
      - "backgrounds/**"
      - "banners/**"
      - "redirects/*.toml"
      - ".github/ci/**"
      - "api/**"
      - "static/**"
      - ".github/workflows/check-redirect-links.yml"

permissions:
  contents: read

jobs:
  redirect-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test redirects, Codex launcher, and link checker
        run: node --test .github/ci/redirects.test.js .github/ci/codex-launcher.test.mjs .github/ci/check-redirect-links.test.js .github/ci/search-copy-toast.test.js
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Test static publishing
        run: bundle exec ruby .github/ci/publish-static.test.rb
      - name: Build the Jekyll site
        run: node api/_generate-redirects.js && bundle exec ruby api/_publish-static.rb
      - name: Verify published redirect registries and behavior
        run: node --test .github/ci/site-redirects.test.js
      - name: Check live redirect destinations
        if: github.event_name != 'pull_request'
        run: node api/_check-redirect-links.js
