name: Compact one-item JS clauses once

on:
  push:
    branches:
      - compact-data-trees

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compact-data-trees
          fetch-depth: 0

      - name: Restore main and condense one-item JS clauses
        run: |
          git fetch origin main
          git checkout origin/main -- index.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          lines = path.read_text().splitlines()
          out = []
          i = 0
          in_plain_script = False

          clause = re.compile(r'^(\s*)(if|else if) \((.*)\) \{$')

          while i < len(lines):
              stripped = lines[i].strip()
              if stripped == "<script>":
                  in_plain_script = True
                  out.append(lines[i])
                  i += 1
                  continue
              if stripped == "</script>":
                  in_plain_script = False
                  out.append(lines[i])
                  i += 1
                  continue

              if in_plain_script and i + 2 < len(lines):
                  match = clause.match(lines[i])
                  if match:
                      indent = match.group(1)
                      body = lines[i + 1]
                      closing = lines[i + 2]
                      body_indent = indent + "  "
                      statement = body.strip()
                      if (
                          body.startswith(body_indent)
                          and body[len(body_indent):] == statement
                          and closing == indent + "}"
                          and statement.endswith(";")
                          and "{" not in statement
                          and "}" not in statement
                      ):
                          out.append(lines[i][:-1] + " " + statement + " }")
                          i += 3
                          continue

              out.append(lines[i])
              i += 1

          path.write_text("\n".join(out) + "\n")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/compact-one-item-clauses-once.yml
          git add index.html
          if git diff --cached --quiet; then
            exit 1
          fi
          git config user.name "John Wooten"
          git config user.email "60260750+JFWooten4@users.noreply.github.com"
          git commit -m "Condense one-item JavaScript clauses" -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:compact-data-trees
