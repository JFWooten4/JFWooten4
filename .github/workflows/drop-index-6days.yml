name: Drop homepage 6days attribution

on:
  push:
    branches:
      - issue-70-neutral-banner-reference

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-70-neutral-banner-reference

      - name: Remove homepage-only attribution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          css = '''    .banner-credit-text a[href="https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298"] {\n      color: inherit;\n      font-weight: inherit;\n    }\n'''
          text = text.replace(css, "", 1)

          old = '''        var imageKey = imageEntry.key || getImageKey(imageEntry.src);\n        var artistLabel = credit.artist || "Unknown artist";\n        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);\n        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";\n\n        if (imageKey === "massie-exposition") {\n          artistHtml += ', <a href="https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298" target="_blank" rel="noreferrer">popularized by 6days1week</a>';\n        }\n\n        return artHtml + " by " + artistHtml;'''
          new = '''        var artistLabel = credit.artist || "Unknown artist";\n        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);\n        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";\n\n        return artHtml + " by " + artistHtml;'''

          if old not in text:
              raise SystemExit("Expected Massie inline attribution renderer not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🖌️ Drop homepage 6days attribution" -m "Keep the provenance note in the banner README while removing it from the live homepage credit." -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:issue-70-neutral-banner-reference
