name: Inline banner credit fix

on:
  push:
    branches:
      - issue-70-neutral-banner-reference

permissions:
  contents: write

jobs:
  fix-credit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-70-neutral-banner-reference

      - name: Inline the supplemental attribution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          old_credit = '      "massie-exposition": { "artist": "Thomas Massie", "note": "popularized by 6days1week", "noteUrl": "https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298", "sourceUrl": "https://youtu.be/Mn6vdsNiaZo?t=10424" },'
          new_credit = '      "massie-exposition": { "artist": "Thomas Massie, popularized by 6days1week", "artistUrl": "https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298", "sourceUrl": "https://youtu.be/Mn6vdsNiaZo?t=10424" },'

          old_renderer = '''        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);\n        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";\n        var noteHtml = "";\n\n        if (credit.note) {\n          noteHtml = credit.noteUrl\n            ? '<a href="' + escapeHtml(credit.noteUrl) + '" target="_blank" rel="noreferrer" style="color: inherit; font-weight: inherit;">' + escapeHtml(credit.note) + "</a>"\n            : escapeHtml(credit.note);\n        }\n\n        return artHtml + " by " + artistHtml + (noteHtml ? ", " + noteHtml : "");'''
          new_renderer = '''        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);\n        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";\n\n        return artHtml + " by " + artistHtml;'''

          old_css = '''    .banner-credit-text a {\n      color: var(--accent);\n    }'''
          new_css = '''    .banner-credit-text a {\n      color: var(--accent);\n    }\n    .banner-credit-text a[href="https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298"] {\n      color: inherit;\n      font-weight: inherit;\n    }'''

          for old, new in ((old_credit, new_credit), (old_renderer, new_renderer), (old_css, new_css)):
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit the cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🖌️ Inline supplemental banner attribution" -m "Keep the 6days provenance link inline and de-emphasized without separate note fields." -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:issue-70-neutral-banner-reference
