name: Massie link fix

on:
  push:
    branches:
      - issue-70-neutral-banner-reference

permissions:
  contents: write

jobs:
  fix-credit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-70-neutral-banner-reference

      - name: Link Massie inline
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text()

          old_credit = '      "massie-exposition": { "artist": "Thomas Massie, popularized by 6days1week", "artistUrl": "https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298", "sourceUrl": "https://youtu.be/Mn6vdsNiaZo?t=10424" },'
          new_credit = '      "massie-exposition": { "artist": "Thomas Massie", "artistUrl": "https://massie.house.gov", "sourceUrl": "https://youtu.be/Mn6vdsNiaZo?t=10424" },'

          old_renderer = '''        var artistLabel = credit.artist || "Unknown artist";\n        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);\n        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";\n\n        return artHtml + " by " + artistHtml;'''
          new_renderer = '''        var imageKey = imageEntry.key || getImageKey(imageEntry.src);\n        var artistLabel = credit.artist || "Unknown artist";\n        var artistHtml = credit.artistUrl ? formatLink(artistLabel, credit.artistUrl) : escapeHtml(artistLabel);\n        var artHtml = credit.sourceUrl ? formatLink("Art", credit.sourceUrl) : "Art";\n\n        if (imageKey === "massie-exposition") {\n          artistHtml += ', <a href="https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298" target="_blank" rel="noreferrer">popularized by 6days1week</a>';\n        }\n\n        return artHtml + " by " + artistHtml;'''

          for old, new in ((old_credit, new_credit), (old_renderer, new_renderer)):
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old[:100]!r}")
              text = text.replace(old, new, 1)

          index.write_text(text)

          readme = Path("banners/README.md")
          rtext = readme.read_text()
          old_readme = '- `massie-exposition` is Thomas Massie from US Gov, [popularized by 6days1week](https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298) ([src](https://youtu.be/Mn6vdsNiaZo?t=10424))'
          new_readme = '- `massie-exposition` is [Thomas Massie](https://massie.house.gov) from US Gov, [popularized by 6days1week](https://discord.com/channels/1102309240145707049/1118990437684875357/1418078804412469298) ([src](https://youtu.be/Mn6vdsNiaZo?t=10424))'
          if old_readme not in rtext:
              raise SystemExit("Expected README attribution not found")
          readme.write_text(rtext.replace(old_readme, new_readme, 1))
          PY

      - name: Commit the update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html banners/README.md
          git commit -m "🖌️ Link Thomas Massie credit" -m "Link Thomas Massie's banner attribution to his official House site while keeping the 6days provenance link inline and de-emphasized." -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:issue-70-neutral-banner-reference
