name: Restore banner README line endings

on:
  push:
    branches:
      - issue-70-neutral-banner-reference

permissions:
  contents: write

jobs:
  restore-eol:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-70-neutral-banner-reference

      - name: Restore CRLF
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("banners/README.md")
          text = path.read_bytes().decode("utf-8").replace("\r\n", "\n").replace("\r", "\n")
          path.write_bytes(text.replace("\n", "\r\n").encode("utf-8"))
          PY

      - name: Commit the cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banners/README.md
          git commit -m "🖊️ Preserve banner README line endings" -m "Restore the existing CRLF formatting so the credit update remains a minimal one-line diff." -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:issue-70-neutral-banner-reference
